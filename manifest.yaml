## AskHR Snap-in Manifest
## Bridges Microsoft Teams to DevRev AskHR agent via two-phase async architecture.
## Reference: https://developer.devrev.ai/snapin-development/references/manifest

version: "2"
name: "AskHR"
description: "Bridges Microsoft Teams to the DevRev AskHR agent. Relays employee HR inquiries with context enrichment and returns real agent responses."

service_account:
  display_name: AskHR Bot

## Keyrings — Teams bot credentials stored securely
keyrings:
  organization:
    - name: teams-bot-credentials
      description: "Microsoft Teams Bot Framework credentials (App ID, App Password, Tenant ID)"
      display_name: Teams Bot Credentials
      types:
        - snap_in_secret
      is_optional: false

## Inputs — non-secret configuration
inputs:
  organization:
    - name: teams_bot_app_id
      description: "Microsoft Teams Bot App ID (also known as Microsoft App ID)"
      field_type: text
      default_value: ""
      is_required: true
      ui:
        display_name: Teams Bot App ID

    - name: teams_bot_tenant_id
      description: "Azure AD Tenant ID for the Teams bot (for single-tenant bots)"
      field_type: text
      default_value: ""
      is_required: false
      ui:
        display_name: Teams Bot Tenant ID

    - name: askhr_agent_id
      description: "The DevRev AskHR agent DON identifier"
      field_type: text
      default_value: "don:core:dvrv-us-1:devo/118bWKFTfx:ai_agent/61"
      is_required: true
      ui:
        display_name: AskHR Agent ID

## Event sources — two-phase async
event_sources:
  organization:
    - name: teams-inbound
      description: "Receives inbound messages from Microsoft Teams Bot Framework webhook"
      display_name: Teams Inbound Webhook
      type: flow-custom-webhook
      config:
        policy: |
          // Accept all Teams webhook payloads
          exports = {
            response: {
              status_code: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: "accepted" }),
            },
          };

    - name: agent-response
      description: "Receives async responses from the AskHR agent after execute-async"
      display_name: Agent Response Listener
      type: flow-custom-webhook
      config:
        policy: |
          exports = {
            response: {
              status_code: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: "accepted" }),
            },
          };

## Functions
functions:
  - name: handle_teams_message
    description: "Parses Teams inbound activity, resolves employee context, and dispatches to AskHR agent via execute-async"

  - name: handle_agent_response
    description: "Extracts agent reply, rebuilds Teams reply context from client_metadata, and sends response back to Teams"

## Automations — wire event sources to functions
automations:
  - name: on-teams-inbound
    source: teams-inbound
    event_types:
      - custom:action
    function: handle_teams_message

  - name: on-agent-response
    source: agent-response
    event_types:
      - custom:action
    function: handle_agent_response
