## AskHR Snap-in Manifest
## Bridges Microsoft Teams to DevRev AskHR agent via two-phase async architecture.
## Reference: https://developer.devrev.ai/snapin-development/references/manifest

version: "2"
name: "Feuji AskHR"
description: "Feuji ASK HR Bridges Microsoft Teams to the DevRev AskHR agent. Relays employee HR inquiries with context enrichment and returns real agent responses."

service_account:
  display_name: Feuji AskHR
  scopes:
    self:
      - scope: dev_user:read
        optional: false
        reason: "Search DevRev users directory to resolve employee email from Teams sender name"
      - scope: ai_agent:read
        optional: false
        reason: "Read AI agent information"
      - scope: ai_agent:write
        optional: false
        reason: "Invoke the AskHR agent via execute-async"

## Keyrings — all sensitive credentials stored securely
keyrings:
  organization:
    - name: teams-app-secret
      description: "Microsoft App Password (client secret) for the Teams bot"
      display_name: Teams App Secret
      types:
        - snap_in_secret

    - name: teams-bot-app-id
      description: "Microsoft App ID (client ID) for the Teams bot"
      display_name: Teams Bot App ID
      types:
        - snap_in_secret

    - name: teams-bot-tenant-id
      description: "Azure AD Tenant ID for the Teams bot"
      display_name: Teams Bot Tenant ID
      types:
        - snap_in_secret

## Inputs — non-secret configuration
inputs:
  organization:
    - name: askhr_agent_id
      description: "The DevRev AskHR agent DON identifier"
      field_type: text
      default_value: "don:core:dvrv-us-1:devo/118bWKFTfx:ai_agent/61"
      is_required: true
      ui:
        display_name: AskHR Agent ID

    - name: agent_response_webhook_id
      description: "DevRev Webhook DON pointing to the agent-response event source"
      field_type: text
      default_value: "don:integration:dvrv-us-1:devo/118bWKFTfx:webhook/vb-FYlRa"
      is_required: false
      ui:
        display_name: Agent Response Webhook ID

    - name: devrev_pat
