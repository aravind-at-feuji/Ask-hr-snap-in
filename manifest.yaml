## Event sources — two-phase async
event_sources:
  organization:
    - name: teams-inbound
      description: "Receives inbound messages from Microsoft Teams Bot Framework webhook"
      display_name: Teams Inbound Webhook
      type: flow-custom-webhook
      setup_instructions: |
        ## Teams Bot Webhook URL
        Configure your Azure Bot / Microsoft Teams Bot Framework messaging endpoint with:
        `{{source.trigger_url}}`
      config:
        policy: |
          package rego

          output = {"event": event, "event_key": event_key} {
              input.request.method == "POST"
              event := input.request.body
              event_key := "action"
          } else = {"response": response} {
              response := {
                  "status_code": 400
              }
          }

    - name: agent-response
      description: "Receives async responses from the AskHR agent after execute-async"
      display_name: Agent Response Listener
      type: flow-custom-webhook
      setup_instructions: |
        ## Agent Response Listener URL
        Webhook URL used by the snap-in to receive asynchronous agent responses:
        `{{source.trigger_url}}`
      config:
        policy: |
          package rego

          output = {"event": event, "event_key": event_key} {
              input.request.method == "POST"
              event := input.request.body
              event_key := "action"
          } else = {"response": response} {
              response := {
                  "status_code": 400
              }
          }

## Functions
functions:
  - name: handle_teams_message
    description: "Parses Teams inbound activity, resolves employee context, and dispatches to AskHR agent via execute-async"

  - name: handle_agent_response
    description: "Extracts agent reply, rebuilds Teams reply context from client_metadata, and sends response back to Teams"

## Automations — wire event sources to functions
automations:
  - name: on-teams-inbound
    source: teams-inbound
    event_types:
      - custom:action
    function: handle_teams_message

  - name: on-agent-response
    source: agent-response
    event_types:
      - custom:action
    function: handle_agent_response
